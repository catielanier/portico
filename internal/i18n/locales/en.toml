[repo_remove_short]
other = "Disable a Portage repository"

[overlay_remove_short]
other = "Disable a Portage overlay"

[repo_remove_long]
other = """Disable an enabled Portage repository.

Portico refuses to remove the protected `gentoo` repository.

Before disabling a repository, Portico checks installed package metadata under
`/var/db/pkg`. If installed packages came from the repository, removal is blocked
unless `--force` is used.

Portico does not delete repository files from `/var/db/repos`, does not delete
package configuration, does not run depclean, and does not migrate installed
packages automatically."""

[repo_remove_example]
other = """  sudo portico {{.Command}} remove guru
  sudo portico {{.Command}} remove guru --force"""

