[repo_short]
other = "Manage Portage repositories"

[overlay_short]
other = "Manage Portage overlays"

[repo_long]
other = """Manage enabled Portage repositories.

`portico {{.Command}}` uses Gentoo's repository tooling as the source of truth.
Enabled repositories are discovered from `eselect repository list -i`.

Portico does not treat `/var/db/repos` directories or Portico sync stamps as
proof that a repository is enabled. Those are supporting filesystem/cache state
only.

The `repo` and `overlay` commands are aliases for the same repository management
behavior."""

[repo_example]
other = """  portico {{.Command}} list
  sudo portico {{.Command}} add guru
  sudo portico {{.Command}} sync
  sudo portico {{.Command}} sync guru
  sudo portico {{.Command}} sync --preflight
  sudo portico {{.Command}} sync guru --preflight
  sudo portico {{.Command}} sync -p
  sudo portico {{.Command}} remove guru
  sudo portico {{.Command}} remove guru --force"""

[repo_list_short]
other = "List enabled Portage repositories"

[overlay_list_short]
other = "List enabled Portage overlays"

[repo_list_long]
other = """List repositories currently enabled through Gentoo repository tooling.

This command reads the enabled repository state from `eselect repository list -i`.
It does not infer enabled repositories from directories under `/var/db/repos`."""

[repo_list_example]
other = """  portico {{.Command}} list"""

[repo_list_heading]
other = "Enabled repositories:"

[repo_list_empty]
other = "No enabled repositories found."

[repo_add_short]
other = "Enable and sync a Portage repository"

[overlay_add_short]
other = "Enable and sync a Portage overlay"

[repo_add_long]
other = """Enable a Portage repository and sync it.

If the repository is already enabled, Portico leaves it enabled and syncs it.
This makes the command safe to run repeatedly.

After enabling, Portico verifies that the repository appears in Gentoo's enabled
repository list before syncing it."""

[repo_add_example]
other = """  sudo portico {{.Command}} add guru"""

[repo_add_privilege_action]
other = "enable repository {{.Repository}}"

[repo_add_enabling]
other = "Ensuring repository {{.Repository}} is enabled and synced..."

[repo_add_success]
other = "Repository {{.Repository}} is enabled and synced."

[repo_sync_short]
other = "Sync enabled Portage repositories"

[overlay_sync_short]
other = "Sync enabled Portage overlays"

[repo_sync_long]
other = """Sync Portage repositories.

With no repository name, this command force-syncs all currently enabled
repositories.

With a repository name, this command force-syncs exactly that enabled repository.

Use `--preflight` or `-p` to perform mirror-friendly preflight sync behavior
instead. Preflight sync only syncs repositories that Portico has never synced or
that are stale according to Portico's sync stamp metadata.

Explicit sync means sync now.
Preflight sync means sync only if needed."""

[repo_sync_example]
other = """  sudo portico {{.Command}} sync
  sudo portico {{.Command}} sync guru

  sudo portico {{.Command}} sync --preflight
  sudo portico {{.Command}} sync -p
  sudo portico {{.Command}} sync guru --preflight
  sudo portico {{.Command}} sync guru -p"""

