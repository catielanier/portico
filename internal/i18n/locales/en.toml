[repo_short]
other = "Manage Portage repositories"

[overlay_short]
other = "Manage Portage overlays"

[repo_long]
other = """Manage enabled Portage repositories.

`portico {{.Command}}` uses Gentoo's repository tooling as the source of truth.
Enabled repositories are discovered from `eselect repository list -i`.

Portico does not treat `/var/db/repos` directories or Portico sync stamps as
proof that a repository is enabled. Those are supporting filesystem/cache state
only.

The `repo` and `overlay` commands are aliases for the same repository management
behavior."""

[repo_example]
other = """  portico {{.Command}} list
  sudo portico {{.Command}} add guru
  sudo portico {{.Command}} sync
  sudo portico {{.Command}} sync guru
  sudo portico {{.Command}} sync --preflight
  sudo portico {{.Command}} sync guru --preflight
  sudo portico {{.Command}} sync -p
  sudo portico {{.Command}} remove guru
  sudo portico {{.Command}} remove guru --force"""

[repo_list_short]
other = "List enabled Portage repositories"

[overlay_list_short]
other = "List enabled Portage overlays"

[repo_list_long]
other = """List repositories currently enabled through Gentoo repository tooling.

This command reads the enabled repository state from `eselect repository list -i`.
It does not infer enabled repositories from directories under `/var/db/repos`."""

[repo_list_example]
other = """  portico {{.Command}} list"""

[repo_list_heading]
other = "Enabled repositories:"

[repo_list_empty]
other = "No enabled repositories found."

