other = "Enable and sync a Portage repository"

[overlay_add_short]
other = "Enable and sync a Portage overlay"

[repo_add_long]
other = """Enable a Portage repository and sync it.

If the repository is already enabled, Portico leaves it enabled and syncs it.
This makes the command safe to run repeatedly.

After enabling, Portico verifies that the repository appears in Gentoo's enabled
repository list before syncing it."""

[repo_add_example]
other = """  sudo portico {{.Command}} add guru"""

