[root_short]
other = "A clearer CLI/TUI entrance to Gentoo Portage"

[root_long]
other = """Portico is a clearer CLI/TUI entrance to Gentoo Portage.

It helps inspect packages, choose USE flags, resolve package-scoped Portage
configuration changes, run package transactions, and manage enabled
repositories/overlays without pretending Portage stopped being the source of
truth.

Portico does not replace emerge, equery, eselect, emaint, or the Gentoo Handbook.
It gives you a safer front porch before walking into the house.

Help routing:
  portico --help
  portico --help find
  portico --help query
  portico --help install
  portico --help rebuild
  portico --help update
  portico --help repo
  portico --help repo sync
  portico --help overlay remove"""

[root_example]
other = """  portico find vlc
  portico query media-video/vlc

  sudo portico install media-video/vlc
  sudo portico install media-video/vlc app-editors/emacs
  sudo portico rebuild media-video/vlc
  sudo portico update
  sudo portico update media-video/vlc

  portico repo list
  sudo portico repo add guru
  sudo portico repo sync
  sudo portico repo sync --preflight
  sudo portico repo remove guru

  portico overlay list
  sudo portico overlay add guru
  sudo portico overlay sync
  sudo portico overlay sync -p
  sudo portico overlay remove guru

  portico --version
  portico -v"""

[find_short]
other = "Search for Portage packages"

[find_long]
other = """Search for Portage packages by name or description.

This command uses Portage search data and displays matching package atoms.
It is read-only and does not require root privileges.

Portico may improve ranking and source display, but package names, descriptions,
versions, and repository metadata come from the Gentoo system."""

[find_example]
other = """  portico find vlc
  portico find ardour
  portico find "video editor" """

[query_short]
other = "Inspect a Portage package"

[query_long]
other = """Inspect a Portage package.

This command shows package USE flag information without installing or modifying
anything. It is read-only and does not require root privileges.

USE flag names and descriptions come from the Gentoo system and are displayed as
provided by Portage tooling."""

[query_example]
other = """  portico query media-video/vlc
  portico query media-sound/ardour
  portico query app-editors/emacs"""

[install_short]
other = "Install Portage packages"

[install_long]
other = """Install one or more Portage packages.

Portico creates a temporary Portage configuration sandbox, resolves package-scoped
configuration changes there first, previews the calculated transaction, asks for
confirmation, then writes approved package-scoped configuration before running
the real emerge transaction.

Portico may prompt for USE flags, testing keywords, licenses, and dependency
configuration changes when Portage requires them.

Portico does not modify global USE flags in make.conf and does not run emerge
--ask. Portico's own confirmation is the confirmation step."""

[install_example]
other = """  sudo portico install media-video/vlc
  sudo portico install media-sound/ardour
  sudo portico install media-video/vlc app-editors/emacs
  sudo portico install app-editors/emacs@30.1"""

[rebuild_short]
other = "Rebuild installed Portage packages"

[rebuild_long]
other = """Rebuild one or more Portage packages.

Use rebuild when a package is already installed but you want to rebuild it with
different package-scoped configuration.

Portico resolves configuration changes in a temporary sandbox, previews the
transaction, asks for confirmation, writes approved configuration, and then runs
the real emerge transaction using --oneshot.

Rebuild does not add rebuilt packages to @world and does not uninstall packages
first."""

[rebuild_example]
other = """  sudo portico rebuild media-video/vlc
  sudo portico rebuild media-sound/ardour
  sudo portico rebuild app-editors/emacs@30.1"""

[update_short]
other = "Update Portage world or selected packages"

[update_long]
other = """Update installed packages.

With no package arguments, Portico updates @world using emerge --update --deep
--newuse @world.

With package arguments, Portico updates only the selected package atoms using
emerge --update --deep --newuse.

The update flow previews the calculated transaction before running the real
update. It can handle some package-scoped license requirements, but update-time
USE autounmask changes are not fully supported yet."""

[update_example]
other = """  sudo portico update
  sudo portico update media-video/vlc
  sudo portico update media-video/vlc app-editors/emacs"""

